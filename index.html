<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBA選手当てチャレンジ｜20問</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1420;color:#f6f8fc;padding:16px}main{max-width:650px;margin:20px auto 60px}.card{background:#1a2535;border:1px solid #34435b;border-radius:18px;padding:24px}h1{font-size:27px;margin:0 0 12px}h2{font-size:21px}.muted{color:#aebed2}.hint{background:#27364a;border-radius:12px;padding:15px;line-height:1.75;margin:13px 0}.hint strong{display:block;margin-bottom:5px;color:#f8d48d}input{width:100%;padding:15px;background:#101a29;border:1px solid #7285a1;color:#fff;border-radius:10px;font-size:16px}button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;background:#f6c963;color:#172030;font-size:16px;font-weight:700;cursor:pointer}button.secondary{background:#334761;color:white}button:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-block;background:#354760;padding:6px 12px;border-radius:99px;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.score{font-size:40px;font-weight:800;color:#f8d48d;margin:16px 0}progress{width:100%;height:8px;accent-color:#f6c963}.error{color:#ffb8aa}.ok{color:#b2f0c0}ol{padding-left:28px}li{padding:8px 0;border-bottom:1px solid #35465e}li.me{color:#f8d48d;font-weight:700}.small{font-size:13px;line-height:1.6}.hide{display:none}a{color:#f6c963}hr{border:0;border-top:1px solid #3b4b61;margin:20px 0}
</style></head><body><main><section class="card"><div id="app">表示テスト成功</div></section></main><script>window.addEventListener('error',function(e){alert('エラー: '+e.message+' / 行: '+e.lineno)});</script><script>
const Q=[
{a:'ショーン・リビングストン',aliases:['shaun livingston','livingston','リビングストン'],h:['NBAキャリア序盤に膝を大けがし、復帰まで長い時間を要した。','ウォリアーズの王朝時代に控えガードとして3度の優勝を経験。','長身ガードで、ミドルレンジのジャンプシュートが得意だった。']},
{a:'マリオ・チャルマーズ',aliases:['mario chalmers','chalmers','チャルマーズ'],h:['2008年のNCAA決勝で、試合を延長に持ち込む劇的な3ポイントシュートを決めた。','ヒートでレブロン・ジェームズ、ウェイド、ボッシュとともに2度優勝。','愛称は「Rio」。']},
{a:'コーリー・ブリュワー',aliases:['corey brewer','brewer','ブリュワー'],h:['フロリダ大学でNCAAを2連覇し、NBAでは1試合51得点を記録した。','2011年のマーベリックス優勝メンバーで、ウルブズやロケッツでもプレー。','非常に細身で、速攻とスティールを得意とするウイング。']},
{a:'レイファー・アルストン',aliases:['rafer alston','alston','アルストン'],h:['NBA入り前にストリートバスケットボールの映像シリーズで人気を集めた。','2009年にドワイト・ハワードを擁するマジックでファイナル進出。','ストリート時代の愛称は「Skip to My Lou」。']},
{a:'トリスタン・トンプソン',aliases:['tristan thompson','thompson','トンプソン','トリスタントンプソン'],h:['2016年のNBAファイナルでは、強力なオフェンスリバウンドでチームを支えた。','キャバリアーズでレブロン・ジェームズとともに3勝1敗からの逆転優勝を経験。','カナダ出身のリバウンドに強いビッグマン。']},
{a:'ユドニス・ハスレム',aliases:['udonis haslem','haslem','ハスレム'],h:['ドラフト外からフランスのプロリーグを経てNBA入りした。','2006年、2012年、2013年にヒートで優勝。','愛称は「UD」。マイアミ一筋で20シーズンを過ごした。']},
{a:'マルコ・ベリネリ',aliases:['marco belinelli','belinelli','ベリネリ'],h:['2014年のオールスターウィークエンドで3ポイントコンテストを制した。','2014年にスパーズで優勝を経験。','イタリア出身で、動きながら放つ3ポイントシュートが特徴的。']},
{a:'ダニエル・ギブソン',aliases:['daniel gibson','gibson','ギブソン'],h:['2007年の東カンファレンス決勝第6戦で31得点を記録した。','レブロン・ジェームズが最初に所属したキャバリアーズで、2007年ファイナル進出に貢献。','愛称は「Boobie」。クリーブランド一筋のシューター。']},
{a:'ジェイソン・テリー',aliases:['jason terry','terry','テリー'],h:['2011年ファイナル第6戦で27得点を挙げ、初優勝に大きく貢献した。','2009年にシックスマン賞を受賞し、ダーク・ノビツキーのチームメイトだった。','愛称は「The Jet」。得点後に両腕を広げるパフォーマンスで知られる。']},
{a:'シェーン・バティエ',aliases:['shane battier','battier','バティエ'],h:['得点以外の貢献が統計分析の観点から注目され、守備の価値を語る際によく取り上げられた。','グリズリーズ、ロケッツなどを経てヒートで2012年と2013年に優勝。','デューク大学出身の守備職人。相手の顔の前に手を出す守備でも知られる。']},
{a:'JJ・バレア',aliases:['jj barea','j.j. barea','barea','バレア','ホセバレア'],h:['2011年のNBAファイナルでは先発に抜擢され、相手の守備をかき回した。','ダーク・ノビツキーらとともにマーベリックス初優勝を経験。','プエルトリコ出身の小柄なポイントガード。']},
{a:'マイク・ミラー',aliases:['mike miller','miller','ミラー'],h:['2012年のNBAファイナル第5戦で7本の3ポイントシュートを成功させた。','新人王とシックスマン賞を異なるシーズンに受賞し、ヒートで2連覇を経験。','長髪の時期もあった高精度の長距離シューター。']},
{a:'トレバー・アリーザ',aliases:['trevor ariza','ariza','アリーザ'],h:['2009年プレーオフで、終盤の重要なスティールを複数回記録した。','コービー・ブライアントとともにレイカーズで2009年優勝を経験。','長いウイングスパンとコーナー3ポイントを武器にした3&D。']},
{a:'ダニー・グリーン',aliases:['danny green','green','グリーン','ダニーグリーン'],h:['2013年のNBAファイナルでは、シリーズ序盤に3ポイント成功数のファイナル記録を更新した。','スパーズ、ラプターズ、レイカーズの3球団でNBA優勝を経験。','守備とキャッチ＆シュートが持ち味のウイング。']},
{a:'ニック・ヤング',aliases:['nick young','young','ヤング','ニックヤング'],h:['シュートが入ったと確信して背を向けたものの、実際には外れた場面が話題になった。','レイカーズで長くプレーした後、ウォリアーズで2018年に優勝。','愛称は「Swaggy P」。']},
{a:'ジャベール・マギー',aliases:['javale mcgee','mcgee','マギー','ジャベールマギー'],h:['珍プレー集「Shaqtin’ a Fool」で何度も取り上げられた。','ウォリアーズで2度、レイカーズで1度の優勝を経験。','非常に長い腕と高い跳躍力を持つセンター。']},
{a:'ケンドリック・パーキンス',aliases:['kendrick perkins','perkins','パーキンス'],h:['2010年のファイナル第6戦で膝を負傷し、最終第7戦に出場できなかった。','2008年にセルティックスで優勝し、後にサンダーでも先発センターを務めた。','強いフィジカルとスクリーンを武器にしたセンターで、引退後は解説者としても知られる。']},
{a:'ネイト・ロビンソン',aliases:['nate robinson','robinson','ロビンソン','ネイトロビンソン'],h:['2013年プレーオフで、ブルズの一員として延長戦を含む試合で34得点を記録した。','スラムダンクコンテストを史上初めて3度制した。','身長175cm前後ながら驚異的な跳躍力を誇ったガード。']},
{a:'ジェレミー・リン',aliases:['jeremy lin','lin','リン','ジェレミーリン'],h:['2012年にニックスで突然大活躍し、短期間で世界的な話題となった。','ハーバード大学出身で、ラプターズの2019年優勝メンバーでもある。','活躍時の社会現象は「Linsanity」と呼ばれた。']},
{a:'PJ・タッカー',aliases:['pj tucker','p.j. tucker','tucker','タッカー','pjタッカー'],h:['NBA入り後に海外リーグへ渡り、数年後にNBAへ復帰した。','ロケッツでスモールボールのセンターも務め、2021年にバックスで優勝。','スニーカー収集家として有名な、フィジカルの強い守備職人。']}
];
const root=document.getElementById('app');let index=0,hint=0,name='',scores=[],phase='start',last=null,rank=[],rankError='',submitted=false,recordId='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>s.toLowerCase().normalize('NFKC').replace(/[\s　・･.\-ー]/g,'');
const sum=()=>scores.reduce((a,b)=>a+b,0);
function render(){if(phase==='start'){root.innerHTML=`<h1>🏀 NBA選手当てチャレンジ</h1><p class="muted">オールスター未選出の選手20人を当てよう！</p><div class="hint"><b>ルール</b><p>ヒント1で正解：5点 ／ ヒント2：3点 ／ ヒント3：1点</p><p><strong>回答は各問題1回のみ。</strong>不正解なら0点で、その問題は終了。ヒントを開く前に勝負するかがカギ！</p><p>満点は100点。最後に参加者全員のランキングを表示します。</p></div><label for="player">参加者名（20文字以内）</label><input id="player" maxlength="20" placeholder="例：NBAファン太郎" autocomplete="nickname" value="${esc(name)}"><button id="start">チャレンジ開始</button><button class="secondary" id="ranking">ランキングを見る</button><p class="muted small">同じ名前でも別の参加記録として登録されます。名前はランキングで公開されます。</p>`;document.getElementById('start').onclick=()=>{const n=document.getElementById('player').value.trim();if(!n||n.length>20){alert('参加者名を1〜20文字で入力してください');return}name=n;phase='quiz';render()};document.getElementById('ranking').onclick=()=>{phase='ranking';loadRank()};return}
if(phase==='quiz'){const q=Q[index];root.innerHTML=`<div class="top"><span class="pill">第 ${index+1} / ${Q.length} 問</span><span>現在 ${sum()} 点</span></div><progress value="${index}" max="${Q.length}"></progress><h2>このNBA選手は誰？</h2><div class="score">${[5,3,1][hint]} 点</div>${q.h.slice(0,hint+1).map((h,i)=>`<div class="hint"><strong>ヒント${i+1}</strong>${esc(h)}</div>`).join('')}<label for="answer">選手名を入力</label><input id="answer" placeholder="例：マイケル・ジョーダン" autocomplete="off"><button id="submit">この回答で確定する（1回限り）</button>${hint<2?`<button class="secondary" id="more">ヒント${hint+2}を見る（正解時 ${[3,1][hint]} 点）</button>`:`<button class="secondary" id="giveup">ギブアップ（0点）</button>`}<p class="muted small">回答すると取り消しできません。正解・不正解に関係なく問題が終了します。</p>`;document.getElementById('submit').onclick=()=>{const input=document.getElementById('answer').value.trim();if(!input){alert('選手名を入力してください');return}const correct=[q.a,...q.aliases].some(a=>normalize(a)===normalize(input));last={correct,answer:q.a,earned:correct?[5,3,1][hint]:0};scores.push(last.earned);phase='feedback';render()};document.getElementById('answer').onkeydown=e=>{if(e.key==='Enter')document.getElementById('submit').click()};if(hint<2)document.getElementById('more').onclick=()=>{hint++;render()};else document.getElementById('giveup').onclick=()=>{last={correct:false,answer:q.a,earned:0};scores.push(0);phase='feedback';render()};return}
if(phase==='feedback'){root.innerHTML=`<div class="pill">第 ${index+1} 問 結果</div><h2 class="${last.correct?'ok':'error'}">${last.correct?'正解！':'不正解'}</h2><div class="score">+${last.earned} 点</div><p>正解：<strong>${esc(last.answer)}</strong></p><p class="muted">現在の合計：${sum()} 点</p><button id="next">${index===Q.length-1?'結果を見る':'次の問題へ →'}</button>`;document.getElementById('next').onclick=()=>{if(index===Q.length-1){phase='result';render();submitScore()}else{index++;hint=0;phase='quiz';render()}};return}
if(phase==='result'){root.innerHTML=`<h1>🏆 全20問終了！</h1><p>${esc(name)} さんの結果</p><div class="score">${sum()} / 100 点</div><p class="muted">正解数：${scores.filter(x=>x>0).length} / 20 問</p><div class="hint">${scores.map((p,i)=>`<span style="display:inline-block;margin:5px">Q${i+1}：${p}点</span>`).join('')}</div><p id="saveStatus" class="muted">ランキングに記録を送信しています…</p><button id="showRank">ランキングを見る</button><button class="secondary" id="again">最初から挑戦する</button>`;document.getElementById('showRank').onclick=()=>{phase='ranking';loadRank()};document.getElementById('again').onclick=restart;return}
if(phase==='ranking'){root.innerHTML=`<h1>🏆 参加者ランキング</h1><p class="muted">20問・100点満点 ／ 同点の場合は先に登録された人が上位</p><div id="rankContent">${rankError?`<p class="error">${esc(rankError)}</p>`:'<p class="muted">読み込み中…</p>'}</div><button class="secondary" id="refresh">ランキングを更新</button><button id="back">${scores.length===20?'自分の結果に戻る':'スタート画面に戻る'}</button>`;document.getElementById('refresh').onclick=loadRank;document.getElementById('back').onclick=()=>{phase=scores.length===20?'result':'start';render()};if(rank.length)showRank();return}}
function restart(){index=0;hint=0;scores=[];phase='start';last=null;submitted=false;recordId='';render()}
async function submitScore(){if(submitted)return;submitted=true;try{const r=await fetch('/.netlify/functions/leaderboard',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,score:sum(),detail:scores})});const d=await r.json();if(!r.ok)throw Error(d.error||'送信できませんでした');recordId=d.id;const el=document.getElementById('saveStatus');if(el)el.textContent='✓ ランキングに登録しました';}catch(e){submitted=false;const el=document.getElementById('saveStatus');if(el){el.innerHTML=`<span class="error">ランキング登録失敗：${esc(e.message)}</span> <button id="retry">再送信</button>`;document.getElementById('retry').onclick=submitScore}}
async function loadRank(){rank=[];rankError='';render();try{const r=await fetch('/.netlify/functions/leaderboard',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'取得できませんでした');rank=d.ranking||[];showRank()}catch(e){rankError=e.message;const el=document.getElementById('rankContent');if(el)el.innerHTML=`<p class="error">${esc(rankError)}</p><p class="small muted">Netlify Dropなどの静的サイト公開ではランキング機能は動きません。GitHub連携でNetlify Functionsを有効にしてください。</p>`}}}
function showRank(){const el=document.getElementById('rankContent');if(!el)return;el.innerHTML=rank.length?`<ol>${rank.map((r,i)=>`<li class="${r.id===recordId?'me':''}"><strong>${esc(r.name)}</strong> — ${r.score}点 ${r.id===recordId?'（あなた）':''}</li>`).join('')}</ol>`:'<p>まだ記録がありません。最初の挑戦者になりましょう！'};}
render();
</script></body></html>
